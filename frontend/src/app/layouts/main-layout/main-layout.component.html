<div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- ── Sidebar ─────────────────────────────────────── -->
  <aside class="sidebar">

    <div class="sidebar-header">
      <img src="img/Logo.png" alt="Alliant Federation" class="sidebar-logo">
      <button class="collapse-btn" (click)="toggleSidebar()" [title]="sidebarCollapsed ? 'Expand' : 'Collapse'">
        <i class="pi" [ngClass]="sidebarCollapsed ? 'pi-chevron-right' : 'pi-chevron-left'"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [title]="sidebarCollapsed ? (item.labelKey | translate) : ''"
        >
          <i class="pi {{ item.icon }}"></i>
          <span class="nav-label">{{ item.labelKey | translate }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">{{ userInitials }}</div>
        <div class="user-info">
          <span class="user-name">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</span>
          <span class="user-role">{{ currentUser?.userEmail }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" [title]="'nav.logout' | translate">
        <i class="pi pi-sign-out"></i>
        <span class="nav-label">{{ 'nav.logout' | translate }}</span>
      </button>
    </div>

  </aside>

  <!-- ── Main area ───────────────────────────────────── -->
  <div class="main-area">

    <header class="topbar">
      <button class="topbar-toggle" (click)="toggleSidebar()">
        <i class="pi pi-bars"></i>
      </button>
      <div class="topbar-brand">
        <span class="topbar-system">Helix</span>
        <span class="topbar-system accent">Comisiones</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-user">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</span>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>

  </div>

</div>
